<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي الاختبارات - أ/ عبدالعزيز الفيفي</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root { 
            --main-color: #2c3e50; 
            --bg-color: #f4f7f6; 
            --white: #ffffff; 
            --correct: #27ae60; 
            --wrong: #e74c3c;
            --passage-bg: rgba(0,0,0,0.03);
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-color); display: flex; justify-content: center; padding: 20px; margin: 0; user-select: none; transition: background 0.5s; }
        .quiz-card { background: var(--white); width: 100%; max-width: 900px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.08); border-top: 12px solid var(--main-color); padding: 35px; position: relative; }
        .header { text-align: center; border-bottom: 2px solid #f0f0f0; margin-bottom: 25px; padding-bottom: 15px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.02); padding: 15px 25px; border-radius: 10px; margin-bottom: 25px; border: 1px solid #eee; }
        
        .challenger-box { color: var(--main-color); font-weight: bold; }
        .q-type-badge { background: var(--main-color); color: white; padding: 8px 20px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; }
        .q-text { font-size: 1.6rem; font-weight: bold; text-align: center; line-height: 1.8; color: #2c3e50; padding: 10px; border-radius: 12px; min-height: 50px; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 25px; }
        .opt { padding: 20px; border: 2px solid #ecf0f1; border-radius: 12px; cursor: pointer; text-align: center; font-size: 1.3rem; background: #fff; transition: 0.2s; color: #34495e; font-weight: 600; }
        .opt:hover { border-color: var(--main-color); background: #f9fbfb; }
        .correct { background: var(--correct) !important; color: white !important; border-color: var(--correct) !important; }
        .wrong { background: var(--wrong) !important; color: white !important; border-color: var(--wrong) !important; }
        .btn { background: var(--main-color); color: white; padding: 15px 55px; border: none; border-radius: 8px; cursor: pointer; font-size: 1.1rem; font-weight: bold; }
        .hidden { display: none !important; }
        input { width: 80%; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 15px; text-align: center; font-size: 1.1rem; }

        /* تنسيق ملخص الإجابات البسيط */
        .summary-box { text-align: right; margin-top: 25px; max-height: 350px; overflow-y: auto; border: 1px solid #eee; border-radius: 10px; padding: 15px; background: #fafafa; }
        .summary-item { padding: 12px; border-bottom: 1px solid #eee; font-size: 0.95rem; line-height: 1.6; }
        .summary-item:last-child { border-bottom: none; }
        .summary-ans-correct { color: var(--correct); font-weight: bold; }
        .summary-ans-wrong { color: var(--wrong); font-weight: bold; }
        .hint-box { font-size: 0.9rem; color: #555; background: #f1f5f9; padding: 8px 12px; border-radius: 6px; margin-top: 10px; text-align: right; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .quiz-card { padding: 20px 15px; border-top-width: 8px; }
            .options-grid { grid-template-columns: 1fr; gap: 12px; }
            .btn { width: 100%; padding: 12px; }
            input { width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
<body>

<div class="quiz-card">
    <div class="header">
        <h3>ثانوية الأمير عبدالمجيد 🎓</h3>
        <h4>أ / عبدالعزيز الفيفي ✨</h4>
    </div>

    <div id="lock-screen" class="hidden" style="text-align: center; padding: 40px;">
        <h1 style="font-size: 4rem; margin: 0;">🚫</h1>
        <h2 style="color: var(--wrong);">تنبيه النظام</h2>
        <p id="lock-message" style="font-size: 1.3rem; line-height: 1.6; color: #555;"></p>
        <button class="btn" onclick="location.reload()" style="margin-top: 20px;">العودة</button>
    </div>

    <div id="start-page" style="text-align: center;">
        <p style="font-weight: bold; color: var(--main-color);">أدخل إيميل منصة مدرستي لبدء التحدي</p>
        <input type="email" id="studentEmail" placeholder="sxxxxxxx@rb.moe.gov.sa">
        <br>
        <button class="btn" onclick="verifyAndStart()">دخول المنصة 🚀</button>
        <p id="status-msg" style="margin-top: 15px; font-weight: bold;"></p>
    </div>

    <div id="quiz-page" class="hidden">
        <div class="nav-bar">
            <div id="q-counter" style="font-weight: bold;"></div>
            <div id="challenger-display" class="challenger-box"></div>
            <div id="timer" style="font-weight: 900; font-size: 1.6rem; color: var(--wrong);">45</div>
        </div>
        <div style="text-align: right; margin-bottom: 10px;">
            <span id="q-type-label" class="q-type-badge"></span>
        </div>
        <div id="question-text" class="q-text"></div>
        <div id="options-area" class="options-grid"></div>
        <div id="hint-display" class="hint-box hidden"></div>
        <div style="text-align: center; margin-top: 35px;">
            <button id="next-btn" class="btn hidden" onclick="nextQuestion()">السؤال التالي ⮕</button>
        </div>
    </div>

    <div id="result-page" class="hidden" style="text-align: center;">
        <h2 id="final-greeting"></h2>
        <div style="font-size: 4rem; font-weight: bold; margin: 15px 0; color: var(--main-color);" id="score-text"></div>
        
        <!-- ملخص الإجابات البسيط (بدون إحصائيات معقدة) -->
        <div style="text-align: right; font-weight: bold; color: var(--main-color); margin-top: 15px;">ملخص إجاباتك:</div>
        <div id="answers-summary" class="summary-box"></div>

        <div style="margin-top: 25px;">
            <button class="btn" onclick="location.reload()">خروج</button>
        </div>
    </div>
</div>

<script>
    // كود الارتباط الشرطي لحماية الملكية الفكرية
    (function checkIPProtection() {
        const requiredSig = "أ/ عبدالعزيز الفيفي";
        const schoolSig = "ثانوية الأمير عبدالمجيد";
        if (!document.documentElement.innerHTML.includes(requiredSig) && !document.body.innerText.includes(schoolSig)) {
            console.warn("تنبيه حماية الملكية الفكرية مفعل.");
        }
    })();

    const themes = [
        {main: "#800000", bg: "#fdf1f1", pbg: "rgba(128, 0, 0, 0.05)"},
        {main: "#2c3e50", bg: "#f4f7f6", pbg: "rgba(44, 62, 80, 0.05)"},
        {main: "#1e3a8a", bg: "#eff6ff", pbg: "rgba(30, 58, 138, 0.05)"},
        {main: "#065f46", bg: "#ecfdf5", pbg: "rgba(6, 95, 70, 0.05)"},
        {main: "#b45309", bg: "#fffbeb", pbg: "rgba(180, 83, 9, 0.05)"},
        {main: "#6d28d9", bg: "#f5f3ff", pbg: "rgba(109, 40, 217, 0.05)"},
        {main: "#0369a1", bg: "#f0f9ff", pbg: "rgba(3, 105, 161, 0.05)"},
        {main: "#be185d", bg: "#fff1f2", pbg: "rgba(190, 24, 93, 0.05)"},
        {main: "#15803d", bg: "#f0fdf4", pbg: "rgba(21, 128, 61, 0.05)"},
        {main: "#4338ca", bg: "#eef2ff", pbg: "rgba(67, 56, 202, 0.05)"},
        {main: "#334155", bg: "#f8fafc", pbg: "rgba: 51, 65, 85, 0.05".replace(/[^a-fA-F0-9#(), ]/g, '')},
        {main: "#7c2d12", bg: "#fff7ed", pbg: "rgba(124, 45, 18, 0.05)"},
        {main: "#1e1b4b", bg: "#fdfdfd", pbg: "rgba(30, 27, 75, 0.03)"}
    ];

    const theme = themes[Math.floor(Math.random() * themes.length)];
    document.documentElement.style.setProperty('--main-color', theme.main);
    document.documentElement.style.setProperty('--bg-color', theme.bg);
    document.documentElement.style.setProperty('--passage-bg', theme.pbg);

    // نموذج بيانات الجملة الاسمية ونواسخها (المفرد، المثنى، جمع المذكر، جمع المؤنث، جمع التكسير، الأسماء الخمسة: أبو وأخو)
    const rawQuizData = [
        { 
            questionNumber: 1, 
            t: "إعراب مفرد", 
            q: "ما إعراب كلمة (الطالبُ) في جملة (الطالبُ مجتهدٌ)؟", 
            answerOptions: [
                { text: "مبتدأ مرفوع وعلامة رفعه الضمة الظاهرة", isCorrect: true },
                { text: "خبر مرفوع بالضمة", isCorrect: false },
                { text: "فاعل مرفوع بالضمة", isCorrect: false },
                { text: "اسم كان مرفوع", isCorrect: false }
            ], 
            hint: "المفرد يُرفع بالضمة الظاهرة. ✨ أ / عبد العزيز الفيفي - ثانوية الأمير عبدالمجيد 🎓" 
        },
        { 
            questionNumber: 2, 
            t: "أخوات كان", 
            q: "كانَ المهندسونَ ......... (اختر الخبر المناسب لجمع المذكر السالم):", 
            answerOptions: [
                { text: "حاضرينَ", isCorrect: true },
                { text: "حاضرون", isCorrect: false },
                { text: "حاضرانِ", isCorrect: false },
                { text: "حاضرةً", isCorrect: false }
            ], 
            hint: "خبر كان منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم. ✨ أ / عبد العزيز الفيفي - ثانوية الأمير عبدالمجيد 🎓" 
        },
        { 
            questionNumber: 3, 
            t: "أخوات إن", 
            q: "إِنَّ الطبيباتِ ......... (اختر الخبر المناسب لجمع المؤنث السالم):", 
            answerOptions: [
                { text: "مخلصاتٌ", isCorrect: true },
                { text: "مخلصاتٍ", isCorrect: false },
                { text: "مخلصاتون", isCorrect: false },
                { text: "مخلصتين", isCorrect: false }
            ], 
            hint: "خبر إن مرفوع وعلامة رفعه الضمة لأنه جمع مؤنث سالم. ✨ أ / عبد العزيز الفيفي - ثانوية الأمير عبدالمجيد 🎓" 
        },
        { 
            questionNumber: 4, 
            t: "المثنى", 
            q: "باتَ الطالبانِ ......... (اختر الخبر الصحيح للمثنى):", 
            answerOptions: [
                { text: "متهجدينِ / ساهرينِ (متهجدينِ)", isCorrect: true },
                { text: "متهجدانِ", isCorrect: false },
                { text: "متهجدين", isCorrect: false },
                { text: "متهجدون", isCorrect: false }
            ], 
            hint: "خبر بات منصوب وعلامة نصبه الياء لأنه مثنى. ✨ أ / عبد العزيز الفيفي - ثانوية الأمير عبدالمجيد 🎓" 
        },
        { 
            questionNumber: 5, 
            t: "الأسماء الخمسة", 
            q: "إِنَّ أباكَ ......... (اختر الخبر المناسب للأسماء الخمسة):", 
            answerOptions: [
                { text: "ذو خلقٍ", isCorrect: true },
                { text: "ذا خلقٍ", isCorrect: false },
                { text: "ذي خلقٍ", isCorrect: false },
                { text: "ذان خلقٍ", isCorrect: false }
            ], 
            hint: "اسم إن منصوب بالألف، وخبرها مرفوع بالواو. ✨ أ / عبد العزيز الفيفي - ثانوية الأمير عبدالمجيد 🎓" 
        },
        { 
            questionNumber: 6, 
            t: "جمع التكسير", 
            q: "كانتِ الطلابُ ......... (تصحيح/اختيار الخبر المناسب لجمع التكسير):", 
            answerOptions: [
                { text: "مستعدينَ (أو مستعدينَ/مستعدون حسب السياق، الخبر منصوب)", isCorrect: true },
                { text: "مستعدون", isCorrect: false },
                { text: "مستعدان", isCorrect: false },
                { text: "مستعدة", isCorrect: false }
            ], 
            hint: "جمع التكسير يُعامل معاملة المفرد في الإعراب غالباً، وخبر كان منصوب بالفتحة. ✨ أ / عبد العزيز الفيفي - ثانوية الأمير عبدالمجيد 🎓" 
        },
        { 
            questionNumber: 7, 
            t: "أخو (الأسماء الخمسة)", 
            q: "ليتَ أخاكَ ......... (اختر الخبر الصحيح):", 
            answerOptions: [
                { text: "مسافرٌ", isCorrect: true },
                { text: "مسافراً", isCorrect: false },
                { text: "مسافرٍ", isCorrect: false },
                { text: "ذو سفرٍ", isCorrect: false }
            ], 
            hint: "ليت من أخوات إن تنصب الاسم وترفع الخبر. ✨ أ / عبد العزيز الفيفي - ثانوية الأمير عبدالمجيد 🎓" 
        },
        { 
            questionNumber: 8, 
            t: "صح وخطأ", 
            q: "أخوات كان تدخل على الجملة الاسمية فتفعل: ترفع المبتدأ ويسمى اسمها، وتنصب الخبر ويسمى خبرها.", 
            answerOptions: [
                { text: "صحيح", isCorrect: true },
                { text: "خطأ", isCorrect: false }
            ], 
            hint: "قاعدة أساسية لعمل أخوات كان. ✨ أ / عبد العزيز الفيفي - ثانوية الأمير عبدالمجيد 🎓" 
        },
        { 
            questionNumber: 9, 
            t: "صح وخطأ", 
            q: "أخوات إن (إن، أن، كأن، لكن، ليت، لعل) تنصب المبتدأ ويسمى اسمها، وترفع الخبر ويسمى خبرها.", 
            answerOptions: [
                { text: "صحيح", isCorrect: true },
                { text: "خطأ", isCorrect: false }
            ], 
            hint: "عكس عمل أخوات كان تماماً. ✨ أ / عبد العزيز الفيفي - ثانوية الأمير عبدالمجيد 🎓" 
        },
        { 
            questionNumber: 10, 
            t: "جمع المذكر", 
            q: "المعلمون ......... (اختر المبتدأ والخبر الصحيحين مرفوعين بالواو):", 
            answerOptions: [
                { text: "مخلصون", isCorrect: true },
                { text: "مخلصين", isCorrect: false },
                { text: "مخلصان", isCorrect: false },
                { text: "مخلصات", isCorrect: false }
            ], 
            hint: "المبتدأ والخبر مرفوعان بالواو لأنهما جمع مذكر سالم. ✨ أ / عبد العزيز الفيفي - ثانوية الأمير عبدالمجيد 🎓" 
        }
    ];

    const currentModelId = "الجملة الاسمية";
    let sName, sEmail, currentIdx = 0, userScore = 0, timer, finalQuestions;
    let studentAnswersLog = [];

    // إعدادات Firebase الخاصة بك
    const myFirebaseConfig = { 
        apiKey: "AIzaSyBkCO7FDQXd89YDf843J4_AtvEFvzzt-R0", 
        authDomain: "aztlg-494c3.firebaseapp.com", 
        projectId: "aztlg-494c3", 
        storageBucket: "aztlg-494c3.firebasestorage.app", 
        messagingSenderId: "597051893949", 
        appId: "1:597051893949:web:de5554ac900317a92b2fd4" 
    };

    const myApp = firebase.initializeApp(myFirebaseConfig, 'myApp');
    const myDb = myApp.firestore();

    async function verifyAndStart() {
        const emailInput = document.getElementById('studentEmail').value.trim().toLowerCase();
        if(!emailInput.includes('@')) return alert("يرجى إدخال إيميل منصة مدرستي");
        
        document.getElementById('status-msg').innerText = "جاري التحقق من بياناتك... ⏳";

        try {
            const allowedDoc = await myDb.collection("allowed_students").doc(emailInput).get();
            if (!allowedDoc.exists) {
                // تجريبي أو للسماح المباشر في حال الاختبار المحلي، يمكن إزالة أو تعديل الشرط حسب الحاجة
                sName = emailInput.split('@')[0];
            } else {
                sName = allowedDoc.data().name;
            }
            sEmail = emailInput;

            document.getElementById('challenger-display').innerText = `المتحدي: ${sName}`;
            finalQuestions = [...rawQuizData].sort(() => Math.random() - 0.5);
            studentAnswersLog = [];
            document.getElementById('start-page').classList.add('hidden');
            document.getElementById('quiz-page').classList.remove('hidden');
            loadQuestion();
        } catch (e) { 
            console.error(e);
            sName = emailInput.split('@')[0];
            sEmail = emailInput;
            document.getElementById('challenger-display').innerText = `المتحدي: ${sName}`;
            finalQuestions = [...rawQuizData];
            document.getElementById('start-page').classList.add('hidden');
            document.getElementById('quiz-page').classList.remove('hidden');
            loadQuestion();
        }
    }

    function showLock(msg) {
        document.getElementById('start-page').classList.add('hidden');
        document.getElementById('lock-screen').classList.remove('hidden');
        document.getElementById('lock-message').innerText = msg;
    }

    function loadQuestion() {
        if(currentIdx >= finalQuestions.length) return finish();
        const data = finalQuestions[currentIdx];
        
        document.getElementById('q-counter').innerText = `سؤال ${currentIdx+1} من ${finalQuestions.length}`;
        document.getElementById('q-type-label').innerText = data.t;
        document.getElementById('question-text').innerHTML = data.q;
        document.getElementById('next-btn').classList.add('hidden');
        
        const hintEl = document.getElementById('hint-display');
        hintEl.classList.add('hidden');
        hintEl.innerHTML = data.hint || "";

        const box = document.getElementById('options-area'); box.innerHTML = '';
        const optsList = data.answerOptions ? data.answerOptions.map(o => o.text) : (data.opts || []);
        
        [...optsList].sort(() => Math.random() - 0.5).forEach(oText => {
            const d = document.createElement('div'); d.className = 'opt'; d.innerText = oText;
            d.onclick = () => {
                clearInterval(timer);
                const targetObj = data.answerOptions ? data.answerOptions.find(item => item.text === oText) : null;
                const isCorrect = targetObj ? targetObj.isCorrect : (oText === data.ans);
                const correctAnsText = targetObj ? (data.answerOptions.find(i=>i.isCorrect)?.text || data.ans) : data.ans;

                if(isCorrect) userScore++;
                
                studentAnswersLog.push({
                    qText: data.q,
                    studentAns: oText,
                    correctAns: correctAnsText,
                    isCorrect: isCorrect
                });

                document.querySelectorAll('.opt').forEach(el => {
                    el.onclick = null;
                    const elObj = data.answerOptions ? data.answerOptions.find(i => i.text === el.innerText) : null;
                    const elCorrect = elObj ? elObj.isCorrect : (el.innerText === data.ans);
                    if(elCorrect) el.classList.add('correct');
                    else if(el.innerText === oText) el.classList.add('wrong');
                });
                
                if(data.hint) {
                    hintEl.classList.remove('hidden');
                }
                document.getElementById('next-btn').classList.remove('hidden');
            };
            box.appendChild(d);
        });
        startTimer();
    }

    function startTimer() {
        let s = 45; document.getElementById('timer').innerText = s;
        clearInterval(timer);
        timer = setInterval(() => {
            s--; document.getElementById('timer').innerText = s;
            if(s<=0) { 
                clearInterval(timer); 
                const data = finalQuestions[currentIdx];
                const correctAnsText = data.answerOptions ? (data.answerOptions.find(i=>i.isCorrect)?.text || "") : data.ans;
                studentAnswersLog.push({
                    qText: data.q,
                    studentAns: "انتهى الوقت (بدون إجابة)",
                    correctAns: correctAnsText,
                    isCorrect: false
                });
                nextQuestion(); 
            }
        }, 1000);
    }

    function nextQuestion() { currentIdx++; loadQuestion(); }

    function finish() {
        document.getElementById('quiz-page').classList.add('hidden');
        document.getElementById('result-page').classList.remove('hidden');
        document.getElementById('final-greeting').innerHTML = `جهدك اليوم محل تقدير، وبإصرار وعزيمة ستصل لمستوى أعلى في المرة المقبلة <br> يا (${sName}) 💐💐 ثانوية الأمير عبدالمجيد 👨‍🎓`;

        document.getElementById('score-text').innerText = `${userScore} / ${finalQuestions.length}`;
        
        // ملخص بسيط بدون إحصائيات معقدة
        const summaryBox = document.getElementById('answers-summary');
        summaryBox.innerHTML = '';
        studentAnswersLog.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'summary-item';
            const statusClass = item.isCorrect ? 'summary-ans-correct' : 'summary-ans-wrong';
            const statusIcon = item.isCorrect ? '✔️' : '❌';
            div.innerHTML = `
                <div><strong>س${index+1}:</strong> ${item.qText}</div>
                <div>إجابتك: <span class="${statusClass}">${item.studentAns} ${statusIcon}</span></div>
                ${!item.isCorrect ? `<div>الإجابة الصحيحة: <span class="summary-ans-correct">${item.correctAns}</span></div>` : ''}
            `;
            summaryBox.appendChild(div);
        });
    }
</script>
</body>
</html>
